name: Python PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Python ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [validate-config, format-check, lint, type-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Poetry
        run: python -m pip install poetry==2.4.2
      - name: Select interpreter and install locked dependencies
        run: |
          python -c "import subprocess, sys; subprocess.run(['poetry', 'env', 'use', sys.executable], check=True)"
          python scripts/dev.py install
      - name: Run ${{ matrix.task }}
        env:
          CHECK_TASK: ${{ matrix.task }}
        run: poetry run python scripts/dev.py "$CHECK_TASK" --evidence-dir "$RUNNER_TEMP/python-quality"
      - name: Retain check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.task }}
          path: ${{ runner.temp }}/python-quality
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Poetry
        run: python -m pip install poetry==2.4.2
      - name: Select interpreter and install locked dependencies
        run: |
          python -c "import subprocess, sys; subprocess.run(['poetry', 'env', 'use', sys.executable], check=True)"
          python scripts/dev.py install
      - name: Run native tests and collect coverage
        run: poetry run python scripts/dev.py test --platform-coverage --evidence-dir "$RUNNER_TEMP/python-tests"
      # Stable names are scoped to this run. A partial rerun replaces only its own
      # platform; successful same-revision peers remain available to the combiner.
      # Earlier attempt logs remain in Actions even when its artifact is replaced.
      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/python-tests
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  coverage:
    name: Python combined coverage
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Poetry
        run: python -m pip install poetry==2.4.2
      - name: Select interpreter and install locked dependencies
        run: |
          python -c "import subprocess, sys; subprocess.run(['poetry', 'env', 'use', sys.executable], check=True)"
          python scripts/dev.py install
      - name: Download native Linux coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-tests-ubuntu-24.04
          path: ${{ runner.temp }}/python-coverage-inputs/Linux
      - name: Download native Windows coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-tests-windows-2025
          path: ${{ runner.temp }}/python-coverage-inputs/Windows
      - name: Enforce configured combined coverage floor
        run: poetry run python scripts/combine_coverage.py "$RUNNER_TEMP/python-coverage-inputs" --output-dir "$RUNNER_TEMP/python-coverage-combined"
      - name: Retain combined coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-combined-coverage
          path: ${{ runner.temp }}/python-coverage-combined
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  gate:
    name: Python gate
    if: always()
    needs: [quality, tests, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every Python check
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          TESTED_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          {
            printf '## Python validation\n\n'
            printf '| Identity | Value |\n| --- | --- |\n'
            printf '| PR head | `%s` |\n' "$PR_HEAD"
            printf '| PR base | `%s` |\n' "$PR_BASE"
            printf '| Tested merge commit | `%s` |\n' "$TESTED_SHA"
            printf '| Run attempt | `%s` |\n\n' "$RUN_ATTEMPT"
            printf '| Check group | Result |\n| --- | --- |\n'
            printf '| Quality | %s |\n' "$QUALITY_RESULT"
            printf '| Native tests | %s |\n' "$TEST_RESULT"
            printf '| Combined coverage | %s |\n' "$COVERAGE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'quality=%s tests=%s coverage=%s\n' "$QUALITY_RESULT" "$TEST_RESULT" "$COVERAGE_RESULT"
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$COVERAGE_RESULT" = success
