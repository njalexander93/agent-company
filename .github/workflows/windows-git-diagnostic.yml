# Temporary diagnostic: remove this workflow and its harness/tests after diagnosis.
name: Temporary Windows WPR Capability

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PYTHONUTF8: "1"

jobs:
  timing:
    if: >-
      github.event.label.name == 'diagnose-windows-git' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install Poetry
        run: python -m pip install poetry==2.4.2
      - name: Install locked dependencies
        run: |
          python -c "import subprocess, sys; subprocess.run(['poetry', 'env', 'use', sys.executable], check=True)"
          python scripts/dev.py install
      - name: Probe native WPR capability only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: poetry run python scripts/windows_git_diagnostic.py --mode wpr-capability --expected-head "$EXPECTED_HEAD" --output "$RUNNER_TEMP/windows-git-diagnostic"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-git-diagnostic-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-git-diagnostic
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
