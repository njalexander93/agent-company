name: AGENT-1 platform validation

# This temporary-branch validation is not product CI or a release pipeline.
on:
  push:
    branches: [agent-1-platform-validation]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          architecture: x64
      - name: Validate native platform and retain evidence
        shell: python
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/agent-1-pre-commit
          EVIDENCE_DIR: ${{ runner.temp }}/agent-1-platform-evidence
          PYTHONUTF8: '1'
        run: |
          import json, os, pathlib, platform, subprocess, sys, tempfile
          sys.path.insert(0, str(pathlib.Path.cwd()))
          from scripts.dev import run_command
          evidence = pathlib.Path(os.environ['EVIDENCE_DIR'])
          evidence.mkdir(parents=True, exist_ok=True)
          expected = 'win32' if os.environ['RUNNER_OS'] == 'Windows' else 'linux'
          assert sys.platform == expected, (sys.platform, expected)
          assert sys.version_info[:3] == (3, 14, 8), sys.version
          host = {'platform': platform.platform(), 'system': platform.system(),
                  'python': sys.version, 'executable': sys.executable,
                  'workspace': str(pathlib.Path.cwd()), 'temp': tempfile.gettempdir(),
                  'git': subprocess.check_output(['git', '--version'], text=True).strip(),
                  'sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()}
          if sys.platform == 'win32':
              fs = ['powershell.exe', '-NoProfile', '-Command',
                    'Get-Volume | Select-Object DriveLetter,FileSystem,FileSystemLabel | ConvertTo-Json']
          else:
              host['distribution'] = platform.freedesktop_os_release()
              fs = ['findmnt', '--json', '--target', str(pathlib.Path.cwd())]
          observed = subprocess.run(fs, capture_output=True, text=True)
          host['filesystem'] = {'command': fs, 'exit_code': observed.returncode,
                                'stdout': observed.stdout, 'stderr': observed.stderr}
          (evidence / 'host.json').write_text(json.dumps(host, indent=2), encoding='utf-8')
          commands = [
              [sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check', 'poetry==2.4.2'],
              ['poetry', 'env', 'use', sys.executable],
              ['poetry', 'sync'],
              ['poetry', 'run', 'python', 'scripts/dev.py', 'check', '--evidence-dir', str(evidence), '--platform-coverage'],
          ]
          for index, command in enumerate(commands):
              status = run_command(command, os.environ.copy(), evidence / f'bootstrap-{index}.log')
              if status:
                  sys.exit(status)
      - name: Retain success or failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-1-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/agent-1-platform-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  combined-coverage:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
          architecture: x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: agent-1-*-${{ github.sha }}
          path: ${{ runner.temp }}/agent-1-native-inputs
      - name: Enforce combined native coverage
        shell: python
        env:
          INPUTS: ${{ runner.temp }}/agent-1-native-inputs
          OUTPUT: ${{ runner.temp }}/agent-1-combined-coverage
        run: |
          import os, pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path.cwd()))
          from scripts.dev import run_command
          output = pathlib.Path(os.environ['OUTPUT'])
          output.mkdir(parents=True, exist_ok=True)
          commands = [
              [sys.executable, '-m', 'pip', 'install', '--disable-pip-version-check', 'poetry==2.4.2'],
              ['poetry', 'env', 'use', sys.executable],
              ['poetry', 'sync'],
              ['poetry', 'run', 'python', 'scripts/combine_coverage.py', os.environ['INPUTS'],
               '--output-dir', str(output)],
          ]
          for index, command in enumerate(commands):
              status = run_command(command, os.environ.copy(), output / f'command-{index}.log')
              if status:
                  sys.exit(status)
      - name: Retain combined gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-1-combined-${{ github.sha }}
          path: ${{ runner.temp }}/agent-1-combined-coverage
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
