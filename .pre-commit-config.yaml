minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format check (staged Python)
        language: unsupported
        entry: poetry run ruff format --check --no-cache
        files: ^(src|tests|scripts)/
        types_or: [python, pyi]
      - id: ruff-lint
        name: Ruff lint (staged Python)
        language: unsupported
        entry: poetry run ruff check --no-fix --no-cache
        files: ^(src|tests|scripts)/
        types_or: [python, pyi]
      - id: mypy
        name: Mypy (configured production scope)
        language: unsupported
        entry: poetry run python scripts/dev.py type-check
        pass_filenames: false
        always_run: true
